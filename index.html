<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linore Virtual Notebook v1</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #34495e; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; margin-bottom: 10px; color: #ecf0f1; }
        .status { font-size: 12px; color: #2ecc71; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .app-btn { background: #ecf0f1; color: #2c3e50; padding: 15px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .app-btn:hover { background: #3498db; color: white; }
        .contact { margin-top: 30px; font-size: 14px; }
        .contact a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Linore Virtual Notebook <small>v1</small></h1>
    <div class="status">● System Active - Web Based Mode</div>
    
    <div class="grid">
        <a href="https://facebook.com" target="_blank" class="app-btn">Facebook</a>
        <a href="https://instagram.com" target="_blank" class="app-btn">Instagram</a>
        <a href="https://whatsapp.com" target="_blank" class="app-btn">WhatsApp</a>
        <a href="https://google.com" target="_blank" class="app-btn">Gmail</a>
        <a href="https://twitter.com" target="_blank" class="app-btn">X / Twitter</a>
        <a href="https://linkedin.com" target="_blank" class="app-btn">LinkedIn</a>
    </div>

    <div class="contact">
        Admin: <a href="mailto:mirfazli2016@gmail.com">mirfazli2016@gmail.com</a>
    </div>
</div>

</body>
</html>
