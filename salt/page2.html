<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salt+ Ecosystem - Page 2</title>
    <style>
        body { 
            background-color: #000; 
            background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: #00ffff; font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px; text-align: center;
        }
        h1 { letter-spacing: 5px; font-weight: 300; text-shadow: 0 0 10px #00ffff; margin-bottom: 30px; }
        
        /* Grid Utama (5 Kolom) */
        .app-grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 15px; max-width: 450px; margin: auto;
        }
        .app-item { text-decoration: none; color: #ccc; font-size: 8px; font-weight: bold; }
        .app-item img { width: 55px; height: 55px; border-radius: 12px; display: block; margin: 0 auto 5px; }

        /* Bagian Google (3 Ikon Bawah) */
        .google-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 25px; padding: 20px;
            margin: 30px auto; max-width: 400px;
            display: flex; justify-content: space-around;
            border: 1px solid rgba(0, 255, 255, 0.1);
        }

        /* Tombol Deactivate */
        .deactivate-btn {
            border: 1.5px solid #00ffff; border-radius: 50px;
            padding: 15px; width: 85%; max-width: 400px;
            margin: 20px auto; color: #00ffff; font-size: 14px;
            letter-spacing: 3px; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            cursor: pointer;
        }

        .nav-link { color: #555; text-decoration: none; font-size: 12px; margin-top: 20px; display: block; }
    </style>
</head>
