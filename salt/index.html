<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salt+ Virtual Smartphone V1</title>
    <style>
        body { 
            background-color: #000; 
            background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            color: #00ffff; font-family: 'Segoe UI', sans-serif;
            margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .phone-frame {
            width: 320px; height: 600px; border: 2px solid #1a1a1a; border-radius: 40px;
            background: #000; padding: 20px; box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
            position: relative; overflow: hidden;
        }
        .header { margin-top: 30px; text-align: center; }
        .header h2 { letter-spacing: 5px; margin: 0; font-weight: 300; font-size: 14px; }
        .logo-main { font-size: 40px; letter-spacing: 10px; margin: 10px 0; text-shadow: 0 0 15px #00ffff; }
        
        .circle-container {
            width: 120px; height: 120px; border: 1px dashed #00ffff;
            border-radius: 50%; margin: 40px auto; display: flex;
            align-items: center; justify-content: center;
        }
        .linore-circle {
            width: 100px; height: 100px; border: 2px solid #00ffff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; text-shadow: 0 0 5px #00ffff;
        }

        .price { font-size: 40px; margin: 0; }
        .price span { font-size: 14px; color: #555; }

        .pin-section { margin-top: 30px; text-align: center; }
        .pin-label { font-size: 10px; letter-spacing: 2px; color: #555; margin-bottom: 10px; }
        input {
            background: none; border: 1.5px solid #00ffff; border-radius: 15px;
            padding: 10px; color: #00ffff; text-align: center; width: 80%;
            letter-spacing: 5px; outline: none; box-shadow: inset 0 0 5px #00ffff;
        }

        .stats { margin-top: 40px; font-size: 10px; color: #555; display: flex; justify-content: space-around; }
        .active-dot { color: #00ffff; }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="header">
        <h2>VIRTUAL SMARTPHONE V1</h2>
        <div class="logo-main">SÀLT+</div>
        <p style="font-size: 8px; letter-spacing: 3px; color: #555;">FAST • CHEAP • ENERGY</p>
    </div>

    <div class="header">
        <p style="font-size: 12px; margin-bottom: 0;">SÀLT+</p>
        <h1 class="price">$3 <br><span style="font-size: 10px;">/Month</span></h1>
    </div>

    <div class="circle-container">
        <div class="linore-circle">LINORE</div>
    </div>

    <div class="pin-section">
        <div class="pin-label">ENTER ACTIVATION PIN</div>
        <input type="text" id="pinInput" placeholder="••••••" maxlength="6">
    </div>

    <div class="stats">
        <div>VISITORS: <span id="v-count">1,024</span></div>
        <div class="active-dot">● ACTIVE: <span id="a-count">142</span></div>
    </div>
</div>

<script>
    const pinInput = document.getElementById('pinInput');
    pinInput.addEventListener('input', function() {
        if (this.value.toLowerCase() === 'free7d') {
            alert('Access Granted! Redirecting...');
            window.location.href = 'page2.html';
        }
    });

    // Simulasi statistik bergerak
    setInterval(() => {
        document.getElementById('a-count').innerText = Math.floor(Math.random() * (150 - 130) + 130);
    }, 3000);
</script>

</body>
</html>
